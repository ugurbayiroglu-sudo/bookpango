
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Payment Status | University Books</title>
  <style>
    body { font-family: system-ui, sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; background: #f4f4f4; }
    .container { background: white; padding: 40px; border-radius: 12px; text-align: center; max-width: 500px; }
    h1 { margin-bottom: 20px; }
    .success { color: green; }
    .error { color: red; }
    .btn { background: #000; color: white; padding: 10px 20px; text-decoration: none; display: inline-block; margin-top: 20px; border-radius: 6px; }
  </style>
</head>
<body>
  <div class="container">
    <h1 id="message">Processing...</h1>
    <a href="/" class="btn">Back to Home</a>
  </div>
  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const status = urlParams.get('status');
    const msgEl = document.getElementById('message');
    if (status === 'success') {
      msgEl.innerHTML = '<span class="success">✅ Payment successful! Thank you for your purchase.</span>';
    } else if (status === 'error') {
      msgEl.innerHTML = '<span class="error">❌ Payment failed. Please try again.</span>';
    } else {
      msgEl.innerHTML = 'Payment status unknown. Please contact support.';
    }
  </script>
</body>
</html>
